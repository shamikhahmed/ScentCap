    <title>ScentCap — Fragrance Wardrobe</title>
    <style>
      /* Boot shell outside #root (keeps FCP stable). Mark only, per HIG launch guidance. Matches system.css --bg. */
      html, body { margin: 0; background: rgb(242, 242, 247); }
      #sc-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: rgb(242, 242, 247);
      }
      #sc-boot img { width: 56px; height: 56px; opacity: 0.92; }
      @media (prefers-color-scheme: dark) {
        html, body, #sc-boot { background: rgb(0, 0, 0); }
      }
    </style>
  </head>
  <body data-cap-app="1" class="light">
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="sc-boot" aria-busy="true" aria-label="Loading ScentCap">
      <img src="%BASE_URL%mark.svg" alt="" width="56" height="56" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/hig-dt.js"></script>
</body>
